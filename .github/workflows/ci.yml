name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # prisma generate (this project's own postinstall script) reads
      # DATABASE_URL via prisma.config.ts, but never actually opens a
      # connection at generate time -- it only needs the schema's model
      # shapes. None of the vitest suite touches a real database either
      # (every test is a pure function test, no src/lib/prisma.ts import
      # anywhere under *.test.ts). This dummy value exists purely so
      # nothing throws on an undefined env var; it's never connected to.
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # npm's "pretypecheck" script (package.json) runs `next typegen`
      # first -- several routes use LayoutProps/PageProps, Next's own
      # generated, route-aware prop types, normally written to
      # .next/types by `next build`/`next dev` and otherwise undefined on
      # a fresh checkout (the TS2304 failure this fixes).
      - run: npm run typecheck

      - run: npm test

  # Applies any pending migration to the real database -- once per push
  # (not once per Vercel build/retry, which is why this lives here and
  # not in package.json's own build script; that one still runs `prisma
  # migrate deploy` too, but by the time Vercel builds, this job has
  # already applied it, so that run just finds nothing pending and
  # no-ops). Only for an actual push to staging/main, never a pull
  # request, and only after lint/typecheck/test pass.
  migrate:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ github.ref == 'refs/heads/main' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy
